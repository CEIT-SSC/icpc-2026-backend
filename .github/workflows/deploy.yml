name: Backend CI/CD (Docker Hub)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: acpc-backend
  SERVER_PATH: /srv/stack

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_REVISION=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, deploy-acm-2026]
    steps:
      - name: Pull & restart services
        env:
          SERVER_PATH: /srv/stack
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$SERVER_PATH"

          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

          deploy_image="$DOCKERHUB_USERNAME/$IMAGE_NAME:$DEPLOY_REVISION"
          latest_image="$DOCKERHUB_USERNAME/$IMAGE_NAME:latest"

          docker pull "$deploy_image"
          docker tag "$deploy_image" "$latest_image"
          docker compose up -d --force-recreate --no-deps backend

          container_id="$(docker compose ps -q backend)"
          running_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$container_id")"
          test "$running_revision" = "$DEPLOY_REVISION"
          echo "Deployed backend revision: $running_revision"

          docker system prune -f
